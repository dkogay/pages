// Colors by work direction (from PPTX)
const DIR_COLORS={
  root:     {bg:"#4a5568",bd:"#a0aec0",lk:"rgba(74,85,104,.45)"},
  marketing:{bg:"#5B9BD5",bd:"#8BB8E8",lk:"rgba(91,155,213,.4)"},
  startup:  {bg:"#70AD47",bd:"#95C96E",lk:"rgba(112,173,71,.4)"},
  analyst:  {bg:"#ED7D31",bd:"#F2A165",lk:"rgba(237,125,49,.4)"},
  investor: {bg:"#FFC000",bd:"#FFD24D",lk:"rgba(255,192,0,.4)",tx:"#3a2800"},
  ops:      {bg:"#8B95A5",bd:"#B0B8C5",lk:"rgba(139,149,165,.4)"}
};
function gc(d,nd){return DIR_COLORS[nd&&nd.dir||"root"]||DIR_COLORS.root}

// Flatten tree with layout
const NODES=[];const EDGES=[];
function buildFlat(node,depth,parent){
  const nd={...node,depth,parent:parent?parent.id:null,children_ids:(node.ch||[]).map(c=>c.id),collapsed:depth>=3&&!!(node.ch&&node.ch.length),visible:true,x:0,y:0,w:0,h:0};
  NODES.push(nd);
  if(node.ch)node.ch.forEach(c=>{EDGES.push({from:node.id,to:c.id});buildFlat(c,depth+1,node)});
}
buildFlat(data,0,null);

function getNode(id){return NODES.find(n=>n.id===id)}

function isVisible(nd){
  if(!nd)return false;
  let cur=nd;
  while(cur.parent){
    const p=getNode(cur.parent);
    if(!p)return false;
    if(p.collapsed)return false;
    cur=p;
  }
  return true;
}

// Layout: horizontal tree
function layout(){
  // Mark visibility
  NODES.forEach(nd=>{nd.visible=isVisible(nd)});

  // Measure text
  const ctx=canvas.getContext("2d");
  NODES.forEach(nd=>{
    const fs=nd.depth===0?14:nd.depth<=2?12:11;
    ctx.font=(nd.depth<=2?"600 ":"400 ")+fs+"px 'Segoe UI',system-ui,sans-serif";
    const lines=wrapText(nd.n,nd.depth===0?28:36,ctx);
    nd._lines=lines;
    const maxW=Math.max(...lines.map(l=>ctx.measureText(l).width));
    nd.w=Math.max(maxW+24,80);
    nd.h=lines.length*18+16;
  });

  // Assign y positions (horizontal tree: x = depth * spacing)
  const HGAP=280;
  const VGAP=8;

  // Position leaves first, then bubble up
  function positionSubtree(id){
    const nd=getNode(id);
    if(!nd||!nd.visible)return{min:0,max:0,h:0};

    nd.x=nd.depth*HGAP;

    const visibleChildren=nd.children_ids.filter(cid=>{const c=getNode(cid);return c&&c.visible&&!getNode(nd.id).collapsed});

    if(visibleChildren.length===0){
      nd.h_total=nd.h;
      return{min:0,max:nd.h,h:nd.h};
    }

    let totalH=0;
    const childResults=[];
    visibleChildren.forEach((cid,i)=>{
      const res=positionSubtree(cid);
      childResults.push(res);
      totalH+=res.h;
      if(i>0)totalH+=VGAP;
    });

    // Position children
    let cy=-totalH/2;
    visibleChildren.forEach((cid,i)=>{
      const c=getNode(cid);
      const res=childResults[i];
      c.y+=cy+res.h/2;
      cy+=res.h+VGAP;
    });

    nd.h_total=Math.max(totalH,nd.h);
    return{min:-totalH/2,max:totalH/2,h:nd.h_total};
  }

  // Reset y
  NODES.forEach(nd=>{nd.y=0});
  positionSubtree("root");

  // Propagate y offsets
  function propagateY(id,offsetY){
    const nd=getNode(id);
    if(!nd||!nd.visible)return;
    nd.y+=offsetY;
    if(!nd.collapsed){
      nd.children_ids.forEach(cid=>propagateY(cid,nd.y));
    }
  }
  propagateY("root",0);
}

function wrapText(text,maxChars,ctx){
  if(!ctx){return text.length<=maxChars?[text]:[text.substring(0,maxChars-1)+"…"]}
  const words=text.split(" ");
  const lines=[];let line="";
  for(const w of words){
    const test=(line?line+" ":"")+w;
    if(test.length>maxChars&&line){lines.push(line);line=w}
    else line=test;
  }
  if(line)lines.push(line);
  return lines;
}

// Canvas rendering
const canvas=document.getElementById("c");
const dpr=window.devicePixelRatio||1;
let W,H;
let panX=0,panY=0,scale=1;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  draw();
}

function draw(){
  layout();
  const ctx=canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(panX,panY+H/2+24);
  ctx.scale(scale,scale);

  // Draw edges
  EDGES.forEach(e=>{
    const from=getNode(e.from),to=getNode(e.to);
    if(!from||!to||!from.visible||!to.visible)return;
    if(from.collapsed)return;
    const c=gc(to.depth,to);
    ctx.strokeStyle=c.lk;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    const x1=from.x+from.w/2,y1=from.y;
    const x2=to.x-to.w/2,y2=to.y;
    const mx=(x1+x2)/2;
    ctx.moveTo(x1,y1);
    ctx.bezierCurveTo(mx,y1,mx,y2,x2,y2);
    ctx.stroke();
  });

  // Draw nodes
  NODES.forEach(nd=>{
    if(!nd.visible)return;
    const c=gc(nd.depth,nd);
    const rx=nd.x-nd.w/2,ry=nd.y-nd.h/2;

    // Shadow
    ctx.shadowColor="rgba(0,0,0,.3)";ctx.shadowBlur=8;ctx.shadowOffsetY=2;

    // Rect
    roundRect(ctx,rx,ry,nd.w,nd.h,6);
    ctx.fillStyle=c.bg;ctx.fill();
    ctx.shadowColor="transparent";
    ctx.strokeStyle=c.bd;ctx.lineWidth=1.2;ctx.stroke();

    // Text
    const fs=nd.depth===0?14:nd.depth<=2?12:11;
    ctx.font=(nd.depth<=2?"600 ":"400 ")+fs+"px 'Segoe UI',system-ui,sans-serif";
    ctx.fillStyle=c.tx||"#fff";ctx.textAlign="center";ctx.textBaseline="middle";
    const lines=nd._lines||[nd.n];
    const lh=18;
    const startY=nd.y-(lines.length-1)*lh/2;
    lines.forEach((line,i)=>{ctx.fillText(line,nd.x,startY+i*lh)});

    // Toggle button
    const hasKids=nd.children_ids.length>0;
    if(hasKids){
      const bx=nd.x+nd.w/2+14,by=nd.y;
      ctx.beginPath();ctx.arc(bx,by,9,0,Math.PI*2);
      ctx.fillStyle=nd.collapsed?c.bg:"rgba(255,255,255,.12)";ctx.fill();
      ctx.strokeStyle=c.tx?"rgba(0,0,0,.4)":"rgba(255,255,255,.5)";ctx.lineWidth=1.2;ctx.stroke();
      ctx.fillStyle=c.tx||"#fff";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(nd.collapsed?"+":"−",bx,by+1);
    }
  });

  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

// Interaction
let dragging=false,lastMX,lastMY;
const tooltipEl=document.getElementById("tooltip");

canvas.addEventListener("mousedown",e=>{dragging=true;lastMX=e.clientX;lastMY=e.clientY});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",e=>{
  if(dragging){panX+=e.clientX-lastMX;panY+=e.clientY-lastMY;lastMX=e.clientX;lastMY=e.clientY;draw();return}
  // Tooltip
  const mx=(e.clientX-panX)/scale,my=(e.clientY-panY-H/2-24)/scale;
  let found=null;
  for(const nd of NODES){
    if(!nd.visible)continue;
    if(mx>=nd.x-nd.w/2&&mx<=nd.x+nd.w/2&&my>=nd.y-nd.h/2&&my<=nd.y+nd.h/2){found=nd;break}
  }
  if(found&&found.s){
    tooltipEl.innerHTML="<strong>"+found.n+"</strong><br>"+found.s;
    tooltipEl.style.opacity=1;tooltipEl.style.left=(e.clientX+16)+"px";tooltipEl.style.top=(e.clientY-8)+"px";
  } else {
    tooltipEl.style.opacity=0;
  }
});

canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  // Smooth zoom: scale step by actual deltaY magnitude (trackpad-friendly)
  const raw=e.deltaY;
  const step=Math.min(Math.abs(raw),100)/100*0.06;
  const zf=raw>0?1-step:1+step;
  const mx=e.clientX,my=e.clientY;
  panX=mx-(mx-panX)*zf;
  panY=my-(my-panY)*zf;
  scale*=zf;
  scale=Math.max(0.08,Math.min(3,scale));
  draw();
},{passive:false});

canvas.addEventListener("click",e=>{
  const mx=(e.clientX-panX)/scale,my=(e.clientY-panY-H/2-24)/scale;
  for(const nd of NODES){
    if(!nd.visible||!nd.children_ids.length)continue;
    // Check toggle button
    const bx=nd.x+nd.w/2+14,by=nd.y;
    if(Math.hypot(mx-bx,my-by)<14){nd.collapsed=!nd.collapsed;draw();return}
    // Check node rect
    if(mx>=nd.x-nd.w/2&&mx<=nd.x+nd.w/2&&my>=nd.y-nd.h/2&&my<=nd.y+nd.h/2){
      nd.collapsed=!nd.collapsed;draw();return;
    }
  }
});

canvas.addEventListener("dblclick",e=>{e.preventDefault()});

function expandAll(){NODES.forEach(nd=>nd.collapsed=false);draw();setTimeout(resetView,50)}
function collapseAll(){NODES.forEach(nd=>{if(nd.depth>0&&nd.children_ids.length)nd.collapsed=true});draw();setTimeout(resetView,50)}
function setLevel(lv){
  NODES.forEach(nd=>{
    if(nd.children_ids.length){nd.collapsed=nd.depth>=lv}
  });
  draw();setTimeout(resetView,50);
}

function resetView(){
  layout();
  const vis=NODES.filter(nd=>nd.visible);
  if(!vis.length)return;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  vis.forEach(nd=>{
    const l=nd.x-nd.w/2,r=nd.x+nd.w/2,t=nd.y-nd.h/2,b=nd.y+nd.h/2;
    if(l<minX)minX=l;if(r>maxX)maxX=r;if(t<minY)minY=t;if(b>maxY)maxY=b;
  });
  const tw=maxX-minX+100,th=maxY-minY+100;
  const sx=(W-40)/tw,sy=(H-100)/th;
  scale=Math.min(sx,sy,1.2)*0.9;
  const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
  panX=W/2-cx*scale;
  panY=H/2+24-cy*scale-H/2-24+H/2+24;
  // Simplify: center on content
  panX=W/2-cx*scale;
  panY=H/2+24-cy*scale;
  draw();
}

window.addEventListener("resize",resize);
resize();
setTimeout(resetView,100);
</script>
</body>
